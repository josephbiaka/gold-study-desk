<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Checklist</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* VOICE: practical and quick, a pre-session routine you tick through.
   IDEA: a pilot's pre-flight checklist card, clipped to the desk.
   PICTURE: the checklist itself, with a progress meter that fills as you tick.
   COLOUR and TYPE: the desk's own ink, panel and brass; Archivo headings, Source Sans body, mono numbers.
   LAYOUT: one column; progress, then sections, then the trade plan with live risk maths. */
:root{--bg:#f3f4f6;--panel:#fff;--ink:#1c2230;--muted:#5d6577;--line:#dde0e7;--brass:#9a6a12;--brass-soft:#f4ead4;--good:#1d7a4f;--bad:#b03a2e;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;--body:"Source Sans 3",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--panel:#1a1f29;--ink:#e7e9ee;--muted:#9aa2b3;--line:#2b3240;--brass:#d9a441;--brass-soft:#2e2615;--good:#5fd39a;--bad:#f08a7e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--panel:#1a1f29;--ink:#e7e9ee;--muted:#9aa2b3;--line:#2b3240;--brass:#d9a441;--brass-soft:#2e2615;--good:#5fd39a;--bad:#f08a7e;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--body)}
main{max-width:720px;margin:0 auto;padding:clamp(20px,4vw,40px) 16px 56px}
h1,h2{font-family:var(--display);font-stretch:82%;font-weight:800;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,5vw,42px)}
h2{font-size:22px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
h2 small{font:600 13px var(--mono);color:var(--muted)}
.sub{color:var(--muted);margin:8px 0 18px;font-size:16px}
.top{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 0 12px;margin-bottom:8px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.meter{flex:1 1 220px;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--brass);transition:width .25s}
.count{font:600 14px var(--mono);white-space:nowrap}
button{font:600 15px var(--body);min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--brass)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:clamp(16px,3vw,24px);margin-bottom:16px}
section.done{border-color:var(--good)}
.item{display:flex;align-items:flex-start;gap:12px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;border-radius:4px}
.item:first-of-type{border-top:0}
.item:hover{background:var(--brass-soft)}
.item input{appearance:none;flex:none;width:24px;height:24px;margin:1px 0 0;border:2px solid var(--muted);border-radius:5px;display:grid;place-items:center;cursor:pointer;background:var(--panel)}
.item input:checked{background:var(--brass);border-color:var(--brass)}
.item input:checked::after{content:"";width:6px;height:12px;border:solid var(--panel);border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.item span{flex:1}
.item input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--brass)}
.key span{font-weight:600}
.key span b{font-family:var(--mono);color:var(--brass);margin-right:6px}
.group{font:700 13px var(--display);font-stretch:85%;letter-spacing:.04em;color:var(--muted);margin:14px 0 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
label.f input,label.f select{font:16px var(--mono);min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.conf{display:flex;gap:6px;flex-wrap:wrap}
.conf button{min-width:44px;padding:0;font-family:var(--mono)}
.conf button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--panel)}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
.out div{background:var(--bg);border-radius:8px;padding:10px 12px}
.out small{display:block;font-size:13px;color:var(--muted)}
.out b{font:600 22px var(--mono);white-space:nowrap}
.ok{color:var(--good)}.warn{color:var(--bad)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
</style>
</head>
<body>
<main>
<h1>My trading checklist</h1>
<p class="sub">MGC / MNQ, 2026. Tick each step before you trade. Ticks reset each day. On weekends, study on this desk.</p>

<div class="top">
  <div class="meter" aria-hidden="true"><i id="bar"></i></div>
  <span class="count" id="count"></span>
  <button type="button" id="reset">Reset</button>
</div>

<div id="list"></div>

<section id="plan">
<h2>Trade plan</h2>
<div class="grid">
  <label class="f">Instrument<select id="inst"><option value="10">MGC ($10 / point)</option><option value="2">MNQ ($2 / point)</option></select></label>
  <label class="f">Contracts<input id="qty" type="number" inputmode="decimal" min="1" step="1" value="1"></label>
  <label class="f">Account size ($)<input id="acct" type="number" inputmode="decimal" min="0" step="1000" value="150000"></label>
</div>
<div class="grid">
  <label class="f">Entry price<input id="entry" type="number" inputmode="decimal" step="any"></label>
  <label class="f">Take profit<input id="tp" type="number" inputmode="decimal" step="any"></label>
  <label class="f">Stop price<input id="stop" type="number" inputmode="decimal" step="any"></label>
</div>
<p class="group">Setup confidence</p>
<div class="conf" id="conf" role="group" aria-label="Setup confidence, 1 to 5"></div>
<div class="out">
  <div><small>Risk-to-reward</small><b id="rr">–</b></div>
  <div><small>Dollar risk</small><b id="risk">–</b></div>
  <div><small>Risk of account</small><b id="pct">–</b></div>
</div>
<p class="note">Filling in each field ticks its box above automatically.</p>
</section>
</main>
<script>
{
const root=document.documentElement;
window.__deskApply=()=>{try{const t=parent.document.documentElement.getAttribute("data-theme");if(t)root.setAttribute("data-theme",t);else root.removeAttribute("data-theme")}catch(e){}};
window.__deskApply();

const SECTIONS=[
  {id:"s1",title:"1. Work desk / news",items:[
    ["Open trading journal"],["Open NinjaTrader 8"],
    ["Open websites: Forex Factory, TradingView (main, weekly volume profile / weekly VWAP, gold lines charts)"]]},
  {id:"s2",title:"2. Setting levels and trend",items:[
    ["Check the chart on these timeframes: weekly, daily, 4-hour, 1-hour"],["Levels (weekly, daily, 3 days)"],
    ["Determine overall trend on daily / 4-hour"],["Check price action (sideways, aggressive initiation, strong rejection)"],
    ["ATR daily (MGC and MNQ)"],["Check volume profile shape: P, b, I, D"],["FVG / IFVG"],
    ["Silver chart comparison"],["Silver / gold ratio"],["VWAP colour system"],["Weak high / weak low"],["Chart pattern"],["TD price action"]]},
  {id:"s3",title:"3. Execution",key:true,items:[
    ["Levels (weekly, daily, 3 days) + volume profile"],["Big orders confirmation on order flow"],["Delta divergence"],
    ["Identify trapped buyers"],["Hoag play"]]},
  {id:"s4",title:"4. Before you enter",items:[
    ["Trade setup confidence (1–5)","conf"],["Entry price","entry"],["Take profit","tp"],["Stop price","stop"],
    ["Risk-to-reward ratio","rr"],["Risk relative to account size","pct"]]}
];
const day=new Date().toDateString();
let st={day,c:{},f:{}};
try{const s=JSON.parse(localStorage.getItem("checklist_state")||"null");if(s&&s.day===day)st=s;else if(s&&s.f)st.f={inst:s.f.inst,qty:s.f.qty,acct:s.f.acct}}catch(e){}
const save=()=>{try{localStorage.setItem("checklist_state",JSON.stringify(st))}catch(e){}};

document.getElementById("list").innerHTML=SECTIONS.map(s=>`<section id="${s.id}"><h2>${s.title}<small id="${s.id}-n"></small></h2>${
  s.items.map((it,i)=>`<label class="item${s.key?" key":""}"><input type="checkbox" id="${s.id}-${i}"${it[1]?` data-auto="${it[1]}"`:""}><span>${s.key?`<b>${i+1}</b>`:""}${it[0]}</span></label>`).join("")}</section>`).join("");
const boxes=[...document.querySelectorAll(".item input")];

function render(){
  boxes.forEach(b=>b.checked=!!st.c[b.id]);
  const done=boxes.filter(b=>b.checked).length;
  document.getElementById("bar").style.width=(done/boxes.length*100)+"%";
  document.getElementById("count").textContent=done+" / "+boxes.length+(done===boxes.length?" · ready":"");
  SECTIONS.forEach(s=>{const bs=boxes.filter(b=>b.id.startsWith(s.id+"-")),n=bs.filter(b=>b.checked).length;
    document.getElementById(s.id+"-n").textContent=n+"/"+bs.length;document.getElementById(s.id).classList.toggle("done",n===bs.length)});
}
boxes.forEach(b=>b.addEventListener("change",()=>{st.c[b.id]=b.checked;save();render()}));

const F=["inst","qty","acct","entry","tp","stop"].reduce((o,k)=>(o[k]=document.getElementById(k),o),{});
Object.entries(F).forEach(([k,el])=>{if(st.f[k]!=null)el.value=st.f[k];el.addEventListener("input",()=>{st.f[k]=el.value;calc()})});
const conf=document.getElementById("conf");
conf.innerHTML=[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" aria-pressed="false">${n}</button>`).join("");
conf.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;st.f.conf=st.f.conf==b.dataset.n?null:b.dataset.n;calc()});

const auto=(k,on)=>{const b=boxes.find(x=>x.dataset.auto===k);if(b&&on)st.c[b.id]=true};
const money=v=>"$"+v.toLocaleString(undefined,{maximumFractionDigits:0});
function calc(){
  [...conf.children].forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.n==st.f.conf)));
  const n=k=>parseFloat(F[k].value),e=n("entry"),t=n("tp"),s=n("stop"),pv=n("inst"),q=n("qty")||0,a=n("acct");
  const rrEl=document.getElementById("rr"),rEl=document.getElementById("risk"),pEl=document.getElementById("pct");
  let rr=null,risk=null,pct=null;
  if(isFinite(e)&&isFinite(s)&&e!==s){risk=Math.abs(e-s)*pv*q;if(isFinite(t))rr=Math.abs(t-e)/Math.abs(e-s);if(a>0)pct=risk/a*100}
  rrEl.textContent=rr==null?"–":"1 : "+rr.toFixed(2);rrEl.className=rr==null?"":rr>=2?"ok":rr<1?"warn":"";
  rEl.textContent=risk==null?"–":money(risk);
  pEl.textContent=pct==null?"–":pct.toFixed(2)+"%";pEl.className=pct==null?"":pct>1?"warn":"ok";
  auto("conf",!!st.f.conf);["entry","tp","stop"].forEach(k=>auto(k,isFinite(n(k))));auto("rr",rr!=null);auto("pct",pct!=null);
  save();render();
}
document.getElementById("reset").addEventListener("click",()=>{st={day,c:{},f:{inst:F.inst.value,qty:F.qty.value,acct:F.acct.value}};
  ["entry","tp","stop"].forEach(k=>F[k].value="");save();calc()});
calc();
}
</script>
</body>
</html>
